{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-12 col-md-8 col-lg-5">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 fw-bold text-center mb-2">欢迎登录</h1>
        <p class="text-muted text-center mb-4">体检信息管理系统</p>

        <form method="post" class="vstack gap-3">
          <div>
            <label for="username" class="form-label">用户名</label>
            <input type="text" id="username" name="username" required class="form-control" placeholder="请输入用户名">
          </div>

          <div>
            <label for="password" class="form-label">密码</label>
            <input type="password" id="password" name="password" required class="form-control" placeholder="请输入密码">
          </div>

          <button type="submit" class="btn btn-primary w-100">登录</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
