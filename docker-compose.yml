services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: health_backend
    ports:
      - "9004:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=health-secret-key-prod-1004
      - DATABASE_URL=sqlite:///instance/health.db
      - PYTHONUNBUFFERED=1
      - APP_TIMEZONE=Asia/Shanghai
      - TZ=Asia/Shanghai
    volumes:
      # 持久化数据库文件
      - backend_data:/app/instance
      # 持久化日志文件
      - backend_logs:/app/logs
    networks:
      - health_network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: nginx:alpine
    container_name: health_frontend
    ports:
      - "4004:80"
    volumes:
      # 挂载静态文件
      - ./app/templates:/usr/share/nginx/html/templates:ro
      - ./app/static:/usr/share/nginx/html/static:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - health_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend_data:
    driver: local
  backend_logs:
    driver: local

networks:
  health_network:
    driver: bridge
